# Every push to main is a version: v<VERSION>.<n>, n counting up from 0 for
# each VERSION (the file at the repository's root — change it to 2.3 or 3.0 to
# start a new series). The tag gets a GitHub release listing its changes, and
# the server deploys it (deploy/autodeploy.sh) with that version on /health
# and in the console.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the version and publish its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git describe --exact-match --tags --match 'v*' HEAD >/dev/null 2>&1; then
            echo "Already tagged: $(git describe --exact-match --tags HEAD)"; exit 0
          fi
          base="$(tr -d '[:space:]' < VERSION)"
          last="$(git tag --list "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          next="v$base.$(( ${last:--1} + 1 ))"
          prev="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"
          git tag "$next" HEAD
          git push origin "$next"
          if [ -n "$prev" ]; then
            gh release create "$next" --title "$next" --generate-notes --notes-start-tag "$prev"
          else
            gh release create "$next" --title "$next" --generate-notes
          fi
          echo "Released $next"
