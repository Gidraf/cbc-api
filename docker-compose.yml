x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    CUSTOM_CA_CERT_B64: ${CUSTOM_CA_CERT_B64:-}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  # Encrypts the saved provider keys. Set it in .env (deploy/harden.sh makes one
  # and moves the saved keys to it); there is no default.
  CBC_MASTER_KEY: ${CBC_MASTER_KEY:-}
  REDIS_URL: redis://redis:6379/0
  POSTER_URL: http://social-poster:6090
  POSTER_TOKEN: ${POSTER_TOKEN:-}
  # Finished videos moved to the owner's Google Drive (backend/scripts/drive_auth.py).
  GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
  GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
  GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
  GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
  DRIVE_KEEP_LOCAL_DAYS: ${DRIVE_KEEP_LOCAL_DAYS:-2}
  # Wallet top-ups with M-Pesa STK push (backend/app/services/mpesa.py).
  MPESA_ENV: ${MPESA_ENV:-sandbox}
  MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
  MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
  MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
  MPESA_PASSKEY: ${MPESA_PASSKEY:-}
  MPESA_TYPE: ${MPESA_TYPE:-paybill}
  MPESA_TILL_NUMBER: ${MPESA_TILL_NUMBER:-}
  MPESA_CALLBACK_TOKEN: ${MPESA_CALLBACK_TOKEN:-}
  # Video renders at once (each drives a browser and ffmpeg). They have their
  # own lane: with CELERY_CONCURRENCY=2, one slot renders while one generates.
  # Videos rendering at once — empty: one for every two cores. They render in
  # render-worker, on their own queue, so they never wait behind generation.
  RENDER_WORKERS: ${RENDER_WORKERS:-}
  CELERY_RENDER_QUEUE: ${CELERY_RENDER_QUEUE:-cbc_render}
  # Database 1, so the generation broker cannot be confused with — or flushed
  # alongside — the older pipeline queue on database 0.
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-cbc_generation}

  # Provider API keys/config
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # OpenAI models by tier: stages that WRITE (notes, material, questions, rewrites, review)
  # and stages that READ (research, classification, extraction). Effort is how hard a
  # reasoning model thinks; reasoning tokens are billed as output.
  OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-6-sol}
  OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
  OPENAI_LIGHT_MODEL: ${OPENAI_LIGHT_MODEL:-gpt-6-luna}
  OPENAI_LIGHT_REASONING_EFFORT: ${OPENAI_LIGHT_REASONING_EFFORT:-low}
  # Set to a long random string to enable GET /api/v1/admin/logs/share?token=… (read-only recent logs). Unset = off.
  LOG_SHARE_TOKEN: ${LOG_SHARE_TOKEN:-}
  PAPER_SERIES_NAME: ${PAPER_SERIES_NAME:-}
  # Stored log lines are pruned hourly: older than this many days, and beyond this many rows.
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
  LOG_KEEP_ROWS: ${LOG_KEEP_ROWS:-20000}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

  # SMTP Mail settings
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-notifications@cbc-api.local}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:-admin@cbc-platform.ke}

  # Langfuse Configuration
  LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-server:3000}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_ENV: ${LANGFUSE_ENV:-prod}
  LANGFUSE_CACHE_TTL: ${LANGFUSE_CACHE_TTL:-300}

  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  MINIO_BUCKET: ${MINIO_BUCKET:-cbc-assets}
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://host.docker.internal:9000}
  PLAYWRIGHT_CDP_URL: ${PLAYWRIGHT_CDP_URL:-http://playwright:3000}
  QUEUE_NAME: ${QUEUE_NAME:-generation_jobs}
  REGENERATION_QUEUE_NAME: ${REGENERATION_QUEUE_NAME:-regeneration_jobs}
  RESULT_TTL_SECONDS: ${RESULT_TTL_SECONDS:-86400}
  # Missing or weak, the API makes a strong one and keeps it in the database.
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-480}
  # Optional, 12+ characters: sets that built-in account's password at start.
  # No defaults — an account still on an old default password is switched off.
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
  REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:-}
  DEVELOPER_PASSWORD: ${DEVELOPER_PASSWORD:-}
  DEVELOPER_API_KEY: ${DEVELOPER_API_KEY:-}

x-backend-depends: &backend-depends
  redis:
    condition: service_healthy
  postgres-gateway:
    condition: service_started

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

services:
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      args:
        # Vite inlines this into the bundle, so it is a build argument rather
        # than a runtime variable. Setting it only in `environment` had no
        # effect on the served console.
        #
        # EMPTY by default, and it should stay empty wherever the console and
        # the API are the same origin. It is an ORIGIN, not a mount point: this
        # API serves /api/v1/... but also /admin, /generate, /pipeline and
        # /health at the ROOT, so "/api" here made every root-mounted call 404
        # — /api/admin/pipeline-bindings. Set it only to point at a different
        # host, e.g. https://api.example.com.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      # Read by vite.config.ts when the preview server starts, so the API can be
      # repointed without rebuilding the image.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      # The host's nginx serves the site; the port is not open to the internet.
      # (CONSOLE_BIND=0.0.0.0 in .env opens it, if you ever need that.)
      - "${CONSOLE_BIND:-127.0.0.1}:5173:5173"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    # The one backend image: built here once, and every backend service below
    # runs it — six builds at once unpacked the same packages side by side
    # and failed (dpkg error 1).
    image: cbc-api-backend:latest
    build: *backend-build
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      # The Mac poster's code, read-only, so "Set up another Mac" in the
      # console downloads exactly what this checkout runs (POSTER_SRC).
      - ./poster:/app/poster_src:ro
    depends_on:
      <<: *backend-depends
      playwright:
        condition: service_started
    extra_hosts: *extra-hosts
    restart: unless-stopped

  worker:
    image: cbc-api-backend:latest       # built by the api service
    pull_policy: never
    command: python -m app.worker
    environment: *backend-env
    depends_on: *backend-depends
    extra_hosts: *extra-hosts
    restart: unless-stopped

  # Content generation — notes, strands, sub-strands, diagrams, media,
  # simulations, activities. Its own process, so a browser refresh, a
  # navigation, a proxy timeout or an API restart cannot lose a run in flight.
  #
  # CONCURRENCY IS 1 ON PURPOSE. These calls cost money and hit provider rate
  # limits, and ten at once is how a run fails halfway with no way to tell
  # which half. Raise it only with a rate limiter in front of the providers.
  # CELERY_CONCURRENCY is how many jobs this worker runs at once. Each job
  # spends its time waiting on a provider, not on this CPU, so 6–8 on a
  # small box is fine; the ceiling is the provider's tokens-per-minute tier
  # and the bill, which scale with it. Two workers never build the same
  # sub-strand — the queue serialises that — so more workers means more
  # sub-strands in flight, not the same one twice.
  #
  # Scale out: `docker compose up -d --scale generation-worker=3`, or run
  # this one service on another machine with the same DATABASE_URL and
  # CELERY_BROKER_URL. The beat lives in `scheduler`, once.
  generation-worker:
    image: cbc-api-backend:latest       # built by the api service
    pull_policy: never
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-1}
      --queues=${CELERY_TASK_QUEUE:-cbc_generation}
      --hostname=generation@%h
    environment:
      <<: *backend-env
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-cbc_generation}
    depends_on: *backend-depends
    extra_hosts: *extra-hosts
    restart: unless-stopped
    # A deploy stops this container with SIGTERM; Celery then finishes the job
    # in hand before it exits. Docker's default of 10 seconds killed every
    # render mid-way. A job still running after this is cut off, and the new
    # worker resumes it at once (its attempt refunded).
    stop_grace_period: 3m

  # Videos: the whiteboard walkthroughs, the social cuts and their cards.
  # Each render keeps about two cores busy, so it runs one per two cores
  # (RENDER_WORKERS overrides), at a lower priority (nice) so the API and
  # the poster's calls always get the CPU first.
  render-worker:
    image: cbc-api-backend:latest       # built by the api service
    pull_policy: never
    command: >
      sh -c 'exec nice -n 10 celery -A app.celery_app worker --loglevel=info
      --queues=$${CELERY_RENDER_QUEUE:-cbc_render}
      --concurrency=$${RENDER_WORKERS:-$$(( ($$(nproc) + 1) / 2 ))}
      --prefetch-multiplier=1 --hostname=render@%h'
    environment:
      <<: *backend-env
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on: *backend-depends
    extra_hosts: *extra-hosts
    restart: unless-stopped
    stop_grace_period: 3m

  # Videos asked for on the spot (Library → Make now): one at a time, on a
  # worker that waits for nothing else, so it starts at once even while the
  # batch renders.
  render-now:
    image: cbc-api-backend:latest       # built by the api service
    pull_policy: never
    command: >
      sh -c 'exec celery -A app.celery_app worker --loglevel=info
      --queues=$${CELERY_RENDER_NOW_QUEUE:-cbc_render_now}
      --concurrency=1 --prefetch-multiplier=1 --hostname=render-now@%h'
    environment:
      <<: *backend-env
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on: *backend-depends
    extra_hosts: *extra-hosts
    restart: unless-stopped
    stop_grace_period: 3m

  # The clock: the job sweep every two minutes, the log prune every hour.
  # One of these, however many workers — a beat in every worker replica
  # would run every schedule N times.
  scheduler:
    image: cbc-api-backend:latest       # built by the api service
    pull_policy: never
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      <<: *backend-env
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-cbc_generation}
    depends_on: *backend-depends
    extra_hosts: *extra-hosts
    restart: unless-stopped

  postgres-gateway:
    image: alpine/socat:1.8.0.0
    command:
      - TCP-LISTEN:5432,fork,reuseaddr
      - TCP:${POSTGRES_GATEWAY_TARGET:-host.docker.internal:5432}
    extra_hosts: *extra-hosts
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    # Loopback only. The services reach it on the compose network as
    # redis:6379; publishing 6379 on every interface put a Redis with no
    # password on the public address, where bots rewrite and wipe open ones.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      # Replaying a large append-only file at start takes longer than 3s;
      # a Redis still loading is not an unhealthy one.
      start_period: 120s
    restart: unless-stopped

  playwright:
    image: browserless/chrome:latest
    environment:
      TOKEN: ""
      MAX_CONCURRENT_SESSIONS: "10"
      CONNECTION_TIMEOUT: "120000"
      PREBOOT_CHROME: "true"
      CORS: "true"
    # No host port. The api and workers reach it on the compose network at
    # http://playwright:3000; publishing 3000 on the host clashed with
    # whatever else held that port, and exposed an unauthenticated browser
    # (TOKEN is empty) to anyone who could reach the server.
    restart: unless-stopped

  langfuse-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_password
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  langfuse-server:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://langfuse:langfuse_password@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-secret-key-32-chars-long!}
      SALT: ${LANGFUSE_SALT:-langfuse-salt-key-32-chars-long!}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    ports:
      # Langfuse's own login is the only thing in front of it: local unless asked.
      - "${LANGFUSE_BIND:-127.0.0.1}:3001:3000"
    restart: unless-stopped

  # The browser poster (poster/): a real browser the owner logs into through
  # its screen (noVNC on 127.0.0.1:6080, behind nginx at /poster/), posting
  # scheduled social videos within the API's rules. Needs POSTER_TOKEN,
  # POSTER_VNC_PASSWORD and POSTER_API_KEY in .env.
  social-poster:
    build: ./poster
    environment:
      CBC_API_URL: http://api:8000
      CBC_API_KEY: ${POSTER_API_KEY:-}
      POSTER_TOKEN: ${POSTER_TOKEN:-}
      VNC_PASSWORD: ${POSTER_VNC_PASSWORD:-}
      YOUTUBE_MADE_FOR_KIDS: ${YOUTUBE_MADE_FOR_KIDS:-no}
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - poster_data:/data
    shm_size: "1gb"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  langfuse_db_data:
  poster_data:
